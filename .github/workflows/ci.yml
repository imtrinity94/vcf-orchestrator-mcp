name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - run: node -e "import('./dist/spec.js').then(m=>{const s=new m.SpecIndex('spec/vcfoo-9.0.0.json');if(s.ops.length<300)process.exit(1);console.log('spec ops',s.ops.length)})"
