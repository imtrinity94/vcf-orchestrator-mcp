name: Publish to npm

# Uses npm trusted publishing (OIDC) — no NPM_TOKEN secret needed.
# One-time setup on npmjs.com → package → Settings → Trusted Publisher:
#   GitHub Actions, owner imtrinity94, repo vcf-orchestrator-mcp, workflow publish.yml

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm publish --access public
